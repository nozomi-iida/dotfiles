# vim: ft=tmux
set -g mode-style "fg=#eee8d5,bg=#073642"

set -g message-style "fg=#eee8d5,bg=#073642"
set -g message-command-style "fg=#eee8d5,bg=#073642"

set -g pane-border-style "fg=#073642"
set -g pane-active-border-style "fg=#eee8d5"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#586e75,bg=#073642"

set -g status-bg "#002b36"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#073642,bg=#eee8d5,bold] #S #[fg=#eee8d5,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #(whoami) #[fg=#93a1a1,bg=#002b36]"
set -g status-right "#[fg=#586e75,bg=#002b36,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#586e75]#[fg=#657b83,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#657b83]#[fg=#93a1a1,bg=#657b83,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #h "

setw -g window-status-activity-style "underscore,fg=#839496,bg=#002b36"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#839496,bg=#002b36"
# tmux-agent-sidebar がpaneオプションに書いた値を、ウィンドウ内の全pane分
# つなげた文字列。下のマーカーの判定材料。
# 注意1: #{P:...} の中でカンマを使うと「アクティブpane用の別フォーマット」の
#        区切りと解釈され、全pane走査にならない。区切りにはスペースを使う。
# 注意2: @_pane_agents だけは区切りを入れない。tmux は空白だけの文字列も真と
#        判定するため、区切りを入れるとエージェント不在でも真になってしまう。
set -g @_pane_states '#{P:#{@pane_status} }'
set -g @_pane_agents '#{P:#{@pane_agent}}'

# ウィンドウ内のエージェント状態を1文字で表すマーカー。
# 優先度が高い状態から順に部分一致を試し、最初に当たったものだけを表示する
# (herdr の Workspace::aggregate_state と同じ「最優先の1つを出す」集約方法)。
# 色は tmux-agent-sidebar の既定値に合わせている (src/ui/colors.rs:57-61)。
# サイドバー側は @sidebar_color_* で変更できるので、変えたらここも揃えること。
#   ● 221黄  waiting        … 許可待ち
#   ● 167赤  error          … エラー
#   ● 114緑  running        … 実行中
#   ● 114緑  background     … 応答は終わったがバックグラウンドのコマンドが生存
#                             (サイドバーが running と同色にしているので合わせた)
#   ● 110青  idle           … 待機中
#   · 244灰  上記以外       … エージェントはいるが状態不明
#     空白   エージェントなし(タブ幅を揃えるため空文字ではなく空白を出す)
# 1行が長くなるので set -ag で継ぎ足して組み立てる。最終行は閉じ括弧のみ。
set -g  @claude_marker '#{?#{m:*waiting*,#{E:@_pane_states}},#[fg=colour221]●,'
set -ag @claude_marker '#{?#{m:*error*,#{E:@_pane_states}},#[fg=colour167]●,'
set -ag @claude_marker '#{?#{m:*running*,#{E:@_pane_states}},#[fg=colour114]●,'
set -ag @claude_marker '#{?#{m:*background*,#{E:@_pane_states}},#[fg=colour114]●,'
set -ag @claude_marker '#{?#{m:*idle*,#{E:@_pane_states}},#[fg=colour110]●,'
set -ag @claude_marker '#{?#{E:@_pane_agents},#[fg=colour244]·, '
set -ag @claude_marker '}}}}}}#[default]'

setw -g window-status-format '#[fg=#002b36,bg=#002b36]#[default] #I  #{E:@claude_marker} #{?#{automatic-rename},#{b:pane_current_path},#W} #[fg=#002b36,bg=#002b36,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#002b36,bg=#eee8d5]#[fg=#b58900,bg=#eee8d5] #I #{E:@claude_marker}#[fg=#eee8d5,bg=#b58900] #{?#{automatic-rename},#{b:pane_current_path},#W} #[fg=#b58900,bg=#002b36,nobold]'
